name: Hermes Upgrade Compatibility Check

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: 'Hermes tag or commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch consistent Hermes source tree
        uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.target_revision }}
          path: hermes-source
          persist-credentials: false
          sparse-checkout: |
            gateway
            cron
            plugins/platforms/feishu

      - name: Show checked-out Hermes revision
        run: |
          echo "Requested Hermes revision: ${{ inputs.target_revision }}"
          git -C hermes-source rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install plugin
        run: pip install -e .

      - name: Run verify
        run: |
          python -c "
          import pathlib
          from hermes_lark_streaming.patcher import Patcher, CronPatcher, FeishuAdapterPatcher
          p = Patcher(pathlib.Path('hermes-source/gateway/run.py'))
          p.verify_target()
          fp = FeishuAdapterPatcher(
              pathlib.Path('hermes-source/plugins/platforms/feishu/adapter.py')
          )
          fp.verify_target()
          cp = CronPatcher(pathlib.Path('hermes-source/cron/scheduler.py'))
          cp.verify_target()
          print('Gateway, Feishu adapter, and Cron targets compatible.')
          "
